<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>حاسبة العمر - احسب عمرك بدقة (سنوات، أشهر، أيام)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="حاسبة عمر لحساب العمر بدقة بالسنوات والأشهر والأيام اعتمادًا على تاريخ الميلاد، مع عرض النتيجة مباشرة.">
    <link rel="canonical" href="../ar/index.html">

    <link rel="stylesheet" href="../style.css">
    
    <meta name="google-site-verification" content="cm_ly3Nmfd9zjZww1OWjvL-p7eDSQjrZWI3VcidmhN8" />

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9618423119887175"
     crossorigin="anonymous"></script>
    
</head>

<body>

    <div class="container">
        <h1>حاسبة العمر</h1>

        
        <div class="cal-switch" role="group" aria-label="نوع التقويم">
            <label>
            <input type="radio" name="calendarType" value="gregorian" checked>
                الميلادي
            </label>
            
            <label>
                <input type="radio" name="calendarType" value="hijri">
                الهجري
            </label>
        </div>

        
        <div class="date-group">
            <div>
                <label>اليوم</label>
                <select id="day"></select>
            </div>
            <div>
                <label>الشهر</label>
                <select id="month"></select>
            </div>
            <div>
                <label>السنة</label>
                <select id="year"></select>
            </div>
        </div>


        <button onclick="calculateAge()">احسب عمري</button>

        <p id="result"></p>

        <div id="details" class="details" style="display:none;"></div>

        <p class="seo-text">
            تحسب هذه الأداة العمر اعتمادًا على تاريخ الميلاد، وتعرض النتيجة بالسنوات والأشهر والأيام.
        </p>

        
        <p class="note">يعتمد الحساب الهجري على تقويم أم القرى.</p>

        
        <a class="lang" href="../en/index.html">🌍 English</a>

        <div class="links">
            <a href="./privacy.html">سياسة الخصوصية</a>
            <a href="./contact.html">اتصل بنا</a>
        </div>


    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/hijri-date@0.2.2/lib/safe.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hijri-date@0.2.2/lib/initializer.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/min/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-hijri@3.0.0/moment-hijri.js"></script>
    
    <script src="../script.js"></script>

</body>
</html>
