<!DOCTYPE html>

<html lang="en" dir="ltr">


<head>
    <meta charset="UTF-8">
    <title>Age Calculator - Calculate Your Exact Age (Years, Months, Days)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Free age calculator to compute your exact age in years, months, and days. Select your birth date and get the result instantly.">
    <link rel="canonical" href="../en/index.html">

    <link rel="stylesheet" href="../style.css">

    <meta name="google-site-verification" content="cm_ly3Nmfd9zjZww1OWjvL-p7eDSQjrZWI3VcidmhN8" />

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9618423119887175"
     crossorigin="anonymous"></script>
    
</head>



<body>

    <div class="container">
        <h1>Age Calculator</h1>

        <label for="birthdate">Birthdate:</label>

        <div class="cal-switch" role="group" aria-label="Calendar type">
          <label>
            <input type="radio" name="calendarType" value="gregorian" checked>
            Gregorian
          </label>

          <label>
            <input type="radio" name="calendarType" value="hijri">
            Hijri
          </label>
        </div>

        <p class="note">Hijri calculation uses the Umm al-Qura calendar.</p>


        <div class="date-group">
            <div>
                <label>Day</label>
                <select id="day"></select>
            </div>
            <div>
                <label>Month</label>
                <select id="month"></select>
            </div>
            <div>
                <label>Year</label>
                <select id="year"></select>
            </div>
        </div>


        <button onclick="calculateAge()">Calculate Age</button>

        <p id="result"></p>

        <div id="details" class="details" style="display:none;"></div>

        <p class="seo-text">
            This age calculator computes your age based on your date of birth and displays the result in years, months, and days.
        </p>



        <a class="lang" href="../ar/index.html">🌍 العربية</a>

        <div class="links">
            <a href="./privacy.html">Privacy Policy</a>
            <a href="./contact.html">Contact</a>
        </div>


    </div>

    <script src="https://cdn.jsdelivr.net/npm/hijri-date@0.2.2/lib/safe.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hijri-date@0.2.2/lib/initializer.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/min/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-hijri@3.0.0/moment-hijri.js"></script>
    
    <script src="../script.js"></script>
    
</body>

</html>
